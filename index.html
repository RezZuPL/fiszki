<style>

:pre-wrap;overflow-wrap:anywhere;cursor:pointer}.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:15px}.front{font-size:clamp(22px,6vw,31px);font-weight:720;line-height:1.32}.back{font-size:18px;margin-top:18px;line-height:1.5}.hint{font-size:12px;color:var(--muted);margin-top:22px}.actions{display:flex;gap:8px;margin-top:11px}.rate{flex:1;padding:10px 3px;font-size:14px}.rate small{display:block;font-weight:500;font-size:11px}.again{background:var(--red);color:#ffb4a7}.good{background:var(--green);color:#8be0ac}.easy{background:#202644;color:#abb7ff}.decklist{display:grid;gap:9px}.deck{width:100%;text-align:left;color:inherit;padding:14px;display:flex;gap:12px;align-items:center}.tile{width:44px;height:44px;border-radius:14px;background:#20233b;color:#aeb8ff;display:grid;place-items:center;font-weight:800}.deckinfo{flex:1;min-width:0}.deckinfo strong,.deckinfo span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deckinfo span{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:35px 17px}.empty h2{margin:8px 0 4px}.empty p{font-size:14px;color:var(--muted);max-width:380px;margin:0 auto 17px}.note{font-size:12px;color:var(--muted);margin-top:13px}.bottom{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hide{display:none!important}dialog{border:1px solid var(--line);border-radius:20px;padding:22px;width:calc(100% - 30px);max-width:430px;background:#14161b;color:var(--ink);box-shadow:0 20px 80px #000a}dialog::backdrop{background:#000b}dialog h2{margin:0}dialog p{font-size:14px;color:var(--muted)}#fileInput{display:none}.toast{position:fixed;bottom:calc(17px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:#e8eaf0;color:#171923;border-radius:13px;padding:11px 15px;max-width:90vw;z-index:5;font-size:14px}

<div class="topline"><div><div class="muted">TWOJA NAUKA</div><h1>Dzień dobry 👋</h1></div><span class="muted" id="deckCount"></span></div>
<div class="stats"><div class="stat"><strong id="dueN">0</strong><span>do powtórki</span></div><div class="stat"><strong id="totalN">0</strong><span>wszystkie fiszki</span></div><div class="stat"><strong id="doneN">0</strong><span>dziś powtórzone</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const KEY='anki-mobile-v1';let dbdata;try{dbdata=JSON.parse(localStorage.getItem(KEY))||{decks:[],reviews:{}}}catch(e){dbdata={decks:[],reviews:{}}}let view='study',pos=0,shown=false,done=0;const el=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),save=()=>localStorage.setItem(KEY,JSON.stringify(dbdata)),clean=s=>String(s||'').replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim(),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function cards(){return dbdata.decks.flatMap(d=>d.cards.map((c,i)=>({...c,_id:d.id+'-'+i,deck:d.name})))}function due(){return cards().filter(c=>(dbdata.reviews[c._id]?.due||'')<=today())}function msg(s){el('toast').textContent=s;el('toast').classList.remove('hide');setTimeout(()=>el('toast').classList.add('hide'),2800)}function setView(v){view=v;render()}function render(){let cs=cards(),ds=due();el('dueN').textContent=ds.length;el('totalN').textContent=cs.length;el('doneN').textContent=done;el('deckCount').textContent=dbdata.decks.length+' talii';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));el('study').classList.toggle('hide',view!=='study');el('decks').classList.toggle('hide',view!=='decks');study();list()}function study(){let root=el('study'),a=due();if(!dbdata.decks.length){root.innerHTML='<div class="panel empty"><div style="font-size:38px">🗂️</div><h2>Zacznij od dodania talii</h2><p>Zaimportuj plik .apkg z AnkiWeb albo swoje fiszki z CSV.</p><button class="btn primary" onclick="openDlg()">＋ Importuj talię</button></div>';return}if(!a.length){root.innerHTML='<div class="panel empty"><div style="font-size:38px">🎉</div><h2>Na dziś gotowe!</h2><p>Nie masz teraz fiszek do powtórki.</p><button class="btn secondary" onclick="setView(\'decks\')">Moje talie</button></div>';return}if(pos>=a.length)pos=0;let c=a[pos];root.innerHTML='<div class="panel"><div class="row"><span>'+esc(c.deck)+'</span><span>'+(pos+1)+' / '+a.length+'</span></div><div class="progress"><i style="width:'+(100*pos/a.length)+'%"></i></div><div class="flash" onclick="flip()"><div class="label">'+(shown?'Odpowiedź':'Pytanie')+'</div><div class="front">'+esc(c.front)+'</div>'+(shown?'<div class="back">'+esc(c.back)+'</div>':'<div class="hint">Dotknij, aby zobaczyć odpowiedź</div>')+'</div><div class="actions">'+(shown?'<button class="rate again" onclick="rate(1)">Jeszcze raz<small>1 min</small></button><button class="rate good" onclick="rate(2)">Dobrze<small>1 dzień</small></button><button class="rate easy" onclick="rate(3)">Łatwe<small>4 dni</small></button>':'<button class="btn primary" style="width:100%" onclick="flip()">Pokaż odpowiedź</button>')+'</div></div>'}function list(){el('decks').innerHTML=dbdata.decks.length?'<div class="decklist">'+dbdata.decks.map(d=>'<div class="deck"><span class="tile">'+esc(d.name[0].toUpperCase())+'</span><span class="deckinfo"><strong>'+esc(d.name)+'</strong><span>'+d.cards.length+' fiszek · '+esc(d.source)+'</span></span></div>').join('')+'</div><div class="bottom"><button class="btn primary" onclick="openDlg()">＋ Importuj talię</button><button class="btn secondary" onclick="backup()">Eksportuj kopię</button></div><p class="note">Postęp i fiszki zapisują się lokalnie w przeglądarce.</p>':'<div class="panel empty"><h2>Brak talii</h2><button class="btn primary" onclick="openDlg()">Importuj talię</button></div>'}function openDlg(){el('dlg').showModal()}function flip(){shown=!shown;study()}function rate(n){let a=due(),c=a[pos];if(!c)return;dbdata.reviews[c._id]={due:new Date(Date.now()+(n===1?0:n===2?1:4)*86400000).toISOString().slice(0,10)};done++;pos=n===1?Math.min(pos+1,a.length-1):0;shown=false;save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dbdata)],{type:'application/json'}));a.download='anki-kopia.json';a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));el('add').onclick=openDlg;el('pick').onclick=()=>el('fileInput').click();el('close').onclick=()=>el('dlg').close();el('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;el('dlg').close();try{let cs=f.name.toLowerCase().endsWith('.apkg')?await apkg(f):await textfile(f);if(!cs.length)throw Error('Nie znaleziono fiszek.');dbdata.decks.push({id:crypto.randomUUID(),name:f.name.replace(/\.(apkg|csv|tsv|txt)$/i,''),cards:cs,source:f.name.toLowerCase().endsWith('.apkg')?'Anki .apkg':'plik '+f.name.split('.').pop()});save();pos=0;view='study';render();msg('Zaimportowano '+cs.length+' fiszek.')}catch(x){msg(x.message||'Nie udało się odczytać pliku.')}e.target.value=''};async function textfile(f){return(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).map(l=>{let a=l.split(l.includes('\t')?'\t':';');if(a.length<2)a=l.split(',');return{front:clean(a[0]),back:clean(a.slice(1).join(' '))}}).filter(c=>c.front&&c.back)}function templ(t,vals,defs){return clean((t||'').replace(/\{\{(?:cloze:)?([^}:]+)(?::[^}]*)?\}\}/g,(_,n)=>{let i=defs.findIndex(f=>f.name===n);return i<0?'':(vals[i]||'')})).replace(/\[sound:[^\]]+\]/gi,'[audio]')}async function apkg(f){if(!window.JSZip||!window.initSqlJs)throw Error('Biblioteki importu niedostępne. Sprawdź internet i spróbuj ponownie.');let z=await JSZip.loadAsync(f),entry=z.file('collection.anki2')||z.file('collection.anki21');if(!entry)throw Error('Nie znaleziono bazy Anki w pliku.');let SQL=await initSqlJs({locateFile:n=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+n}),db=new SQL.Database(new Uint8Array(await entry.async('uint8array')));try{let models=db.exec('SELECT models FROM col'),map={};if(models[0])Object.values(JSON.parse(models[0].values[0][0])).forEach(m=>map[m.id]=m);let notes=db.exec('SELECT id,flds,mid FROM notes'),nm=new Map();if(notes[0])notes[0].values.forEach(r=>nm.set(String(r[0]),{v:String(r[1]).split('\x1f'),m:map[r[2]]}));let rows=db.exec('SELECT nid,ord FROM cards'),out=[],seen=new Set();if(rows[0])for(let r of rows[0].values){let n=nm.get(String(r[0]));if(!n)continue;let t=n.m?.tmpls?.[r[1]]||n.m?.tmpls?.[0],defs=n.m?.flds||[],front=templ(t?.qfmt,n.v,defs),back=templ(t?.afmt,n.v,defs).replace(front,'').trim(),k=front+'\0'+back;if(front&&back&&!seen.has(k)){seen.add(k);out.push({front,back})}}if(!out.length&&notes[0])notes[0].values.forEach(r=>{let a=String(r[1]).split('\x1f').map(clean).filter(Boolean);if(a.length>1)out.push({front:a[0],back:a.slice(1).join('\n')})});return out}finally{db.close()}}render();
</script>
<script>
// Upgrade older saved cards to stable IDs and keep the old review state.
for(const d of dbdata.decks){for(let i=0;i<d.cards.length;i++){const c=d.cards[i],old=d.id+'-'+i;if(!c.id){c.id=crypto.randomUUID();if(dbdata.reviews[old]){const r=dbdata.reviews[old];if(r.due>today())dbdata.reviews[d.id+'-'+c.id]={answer:'yes'};delete dbdata.reviews[old]}}}}save();
let inspectDeck=null,editTarget=null,sessionSeen=new Set();
cards=function(){let changed=false;const out=dbdata.decks.flatMap(d=>d.cards.map(c=>{if(!c.id){c.id=crypto.randomUUID();changed=true}return{...c,_id:d.id+'-'+c.id,deck:d.name,deckId:d.id}}));if(changed)save();return out};
due=function(){return cards().filter(c=>!dbdata.reviews[c._id]&&!sessionSeen.has(c._id))};
setView=function(v){view=v;if(v!=='decks')inspectDeck=null;render()};
study=function(){const root=el('study'),a=due();if(!dbdata.decks.length){root.innerHTML='<div class="panel empty"><h2>Dodaj swoje fiszki</h2><p>Zaimportuj talię albo utwórz własną.</p><button class="btn primary" onclick="openDlg()">＋ Importuj talię</button></div>';return}if(!a.length){root.innerHTML='<div class="panel empty"><div style="font-size:38px">✓</div><h2>To wszystkie fiszki</h2><p>Na teraz gotowe. Możesz zresetować talię i zacząć od początku.</p><button class="btn secondary" onclick="setView(\'decks\')">Moje talie</button></div>';return}if(pos>=a.length)pos=0;const c=a[pos];root.innerHTML='<div class="panel"><div class="row"><span>'+esc(c.deck)+'</span><span>'+(pos+1)+' / '+a.length+'</span></div><div class="progress"><i style="width:'+(100*pos/a.length)+'%"></i></div><div class="flash" onclick="flip()"><div class="label">'+(shown?'Odpowiedź':'Pytanie')+'</div><div class="front">'+esc(c.front)+'</div>'+(shown?'<div class="back">'+esc(c.back)+'</div>':'<div class="hint">Dotknij fiszki, aby ją odwrócić</div>')+'</div><div class="actions">'+(shown?'<button class="rate answer-no" onclick="rate(\'no\')">NIE</button><button class="rate answer-yes" onclick="rate(\'yes\')">TAK</button>':'<button class="btn primary" style="width:100%" onclick="flip()">Odwróć fiszkę</button>')+'</div></div>'};
list=function(){const root=el('decks');if(inspectDeck){const d=dbdata.decks.find(x=>x.id===inspectDeck);if(!d){inspectDeck=null;return list()}root.innerHTML='<button class="btn secondary" onclick="inspectDeck=null;render()">‹ Wróć do talii</button><h2>'+esc(d.name)+'</h2><div class="muted">'+d.cards.length+' fiszek</div><div class="toolrow"><button class="btn primary" onclick="editCard(\''+d.id+'\',null)">＋ Dodaj fiszkę</button><button class="btn secondary" onclick="resetDeck(\''+d.id+'\')">Resetuj od początku</button><button class="btn secondary" onclick="downloadDeck(\''+d.id+'\')">Zapisz do pliku</button></div><div>'+d.cards.map((c,i)=>'<div class="cardrow"><div class="cardtext"><strong>'+esc(c.front)+'</strong><span>'+esc(c.back)+'</span></div><button class="btn secondary mini" onclick="editCard(\''+d.id+'\',\''+c.id+'\')">Edytuj</button><button class="btn danger mini" onclick="deleteCard(\''+d.id+'\',\''+c.id+'\')">Usuń</button></div>').join('')+'</div>';return}root.innerHTML=dbdata.decks.length?'<div class="decklist">'+dbdata.decks.map(d=>'<button class="deck" onclick="openDeck(\''+d.id+'\')"><span class="tile">'+esc(d.name[0].toUpperCase())+'</span><span class="deckinfo"><strong>'+esc(d.name)+'</strong><span>'+d.cards.length+' fiszek · '+esc(d.source)+'</span></span><span>›</span></button>').join('')+'</div><div class="bottom"><button class="btn primary" onclick="createDeck()">＋ Nowa talia</button><button class="btn secondary" onclick="openDlg()">Importuj</button><button class="btn secondary" onclick="backup()">Eksportuj kopię</button></div>':'<div class="panel empty"><h2>Brak talii</h2><button class="btn primary" onclick="createDeck()">＋ Utwórz talię</button></div>'};
function openDeck(id){inspectDeck=id;view='decks';render()}function createDeck(){const n=prompt('Nazwa nowej talii:');if(!n||!n.trim())return;const d={id:crypto.randomUUID(),name:n.trim(),source:'własna talia',cards:[]};dbdata.decks.push(d);save();inspectDeck=d.id;view='decks';render()}
function editCard(deckId,cardId){const d=dbdata.decks.find(x=>x.id===deckId);if(!d)return;editTarget={deckId,cardId};const c=d.cards.find(x=>x.id===cardId);el('editTitle').textContent=c?'Edytuj fiszkę':'Nowa fiszka';el('frontInput').value=c?.front||'';el('backInput').value=c?.back||'';el('cardDlg').showModal()}
el('saveCard').onclick=()=>{const d=dbdata.decks.find(x=>x.id===editTarget?.deckId),front=el('frontInput').value.trim(),back=el('backInput').value.trim();if(!d||!front||!back){msg('Wpisz przód i tył fiszki.');return}let c=d.cards.find(x=>x.id===editTarget.cardId);if(c){c.front=front;c.back=back;delete dbdata.reviews[d.id+'-'+c.id]}else d.cards.push({id:crypto.randomUUID(),front,back});el('cardDlg').close();sessionSeen.clear();save();render();msg('Zapisano fiszkę.')};el('cancelCard').onclick=()=>el('cardDlg').close();
function deleteCard(deckId,cardId){if(!confirm('Usunąć tę fiszkę?'))return;const d=dbdata.decks.find(x=>x.id===deckId);d.cards=d.cards.filter(c=>c.id!==cardId);delete dbdata.reviews[deckId+'-'+cardId];save();render()}
function resetDeck(deckId){if(!confirm('Zresetować tę talię? Wszystkie odpowiedzi TAK/NIE zostaną wyczyszczone.'))return;for(const c of cards().filter(c=>c.deckId===deckId)){delete dbdata.reviews[c._id];sessionSeen.delete(c._id)}pos=0;save();render();msg('Talia gotowa do nauki od początku.')}
rate=function(answer){const c=due()[pos];if(!c)return;dbdata.reviews[c._id]={answer};sessionSeen.add(c._id);done++;shown=false;pos=0;save();render()};
render();
</script>
<script>
// Load project decks listed in fiszki/decks.json (for GitHub Pages).
async function loadProjectDecks(){try{const manifest=await fetch('fiszki/decks.json',{cache:'no-store'});if(!manifest.ok)return;const files=await manifest.json();let changed=false;for(const file of files){const path='fiszki/'+file;if(dbdata.decks.some(d=>d.repoFile===path))continue;const response=await fetch(path);if(!response.ok)continue;const ext=file.toLowerCase().split('.').pop(),name=file.replace(/\.[^.]+$/,'');let imported,completed=[],responses={};if(ext==='apkg'){imported=await apkg(await response.arrayBuffer())}else if(ext==='csv'||ext==='tsv'||ext==='txt'){const value=await response.text();imported=await textfile({name:file,text:async()=>value})}else if(ext==='json'){const payload=await response.json();if(payload.format!=='anki-mobile-deck-v1'||!Array.isArray(payload.cards))continue;imported=payload.cards;completed=payload.completed||[];responses=payload.responses||{}}else continue;if(!imported.length)continue;const existing=ext==='json'?dbdata.decks.find(d=>d.source==='folder GitHub'&&d.name===name):null,id=existing?.id||crypto.randomUUID(),deckCards=imported.map(c=>({id:c.id||crypto.randomUUID(),front:c.front,back:c.back}));if(existing){for(const c of existing.cards)delete dbdata.reviews[id+'-'+c.id];existing.cards=deckCards;existing.repoFile=path}else dbdata.decks.push({id,name,cards:deckCards,source:'folder GitHub',repoFile:path});for(const c of deckCards){const answer=responses[c.id]||(completed.includes(c.id)?'yes':null);if(answer)dbdata.reviews[id+'-'+c.id]={answer}}changed=true}if(changed){save();render()}}catch(e){console.warn('Nie udało się wczytać talii z folderu fiszki:',e)}}loadProjectDecks();
</script>
<script>
// NIE sends the current card to the back of a persistent round-robin queue.
let pendingOrder=Array.isArray(dbdata.pendingOrder)?dbdata.pendingOrder:[];
due=function(){const remaining=cards().filter(c=>dbdata.reviews[c._id]?.answer!=='yes'),byId=new Map(remaining.map(c=>[c._id,c])),valid=new Set(byId.keys());pendingOrder=pendingOrder.filter(id=>valid.has(id));for(const c of remaining)if(!pendingOrder.includes(c._id))pendingOrder.push(c._id);dbdata.pendingOrder=pendingOrder;return pendingOrder.map(id=>byId.get(id)).filter(Boolean)};
rate=function(answer){const queue=due(),c=queue[pos];if(!c)return;if(answer==='yes'){dbdata.reviews[c._id]={answer:'yes'};pendingOrder=pendingOrder.filter(id=>id!==c._id);done++}else{dbdata.reviews[c._id]={answer:'no'};pendingOrder=pendingOrder.filter(id=>id!==c._id);pendingOrder.push(c._id)}shown=false;pos=0;dbdata.pendingOrder=pendingOrder;save();render()};
textfile=async function(f){const raw=(await f.text()).replace(/^\uFEFF/,'');let sep=null,lines=[];for(const line of raw.split(/\r?\n/)){if(/^\s*#separator\s*:/i.test(line)){let v=line.replace(/^\s*#separator\s*:/i,'').trim().toLowerCase();sep=({tab:'\t',colon:':',space:' ',semicolon:';',comma:',',pipe:'|'})[v]||(['\t',':','; ',',','|'].includes(v)?v:null);continue}if(/^\s*#/.test(line)||!line.trim())continue;lines.push(line)}if(!sep){const first=lines[0]||'';const ext=(f.name||'').toLowerCase().split('.').pop();if(first.includes('\t'))sep='\t';else if(ext==='tsv')sep='\t';else if(ext==='csv')sep=first.includes(';')?';':',';else if(first.includes(':'))sep=':';else if(first.includes(';'))sep=';';else if(first.includes(','))sep=',';else sep=' '}function splitFirst(line,delimiter){if(delimiter===' '){const m=line.match(/\s/);if(!m)return[line];const i=m.index;return[line.slice(0,i),line.slice(i+1).trimStart()]}const i=line.indexOf(delimiter);return i<0?[line]:[line.slice(0,i),line.slice(i+delimiter.length)]}function unquote(s){s=s.trim();if(s.length>1&&s[0]==='"'&&s[s.length-1]==='"')s=s.slice(1,-1).replace(/""/g,'"');return clean(s)}return lines.map(line=>{const a=splitFirst(line,sep);return{front:unquote(a[0]),back:unquote(a.slice(1).join(sep))}}).filter(c=>c.front&&c.back)};
function downloadDeck(deckId){const d=dbdata.decks.find(x=>x.id===deckId);if(!d)return;const responses={};for(const c of d.cards){const answer=dbdata.reviews[d.id+'-'+c.id]?.answer;if(answer)responses[c.id]=answer}const payload={format:'anki-mobile-deck-v1',name:d.name,cards:d.cards.map(c=>({id:c.id,front:c.front,back:c.back})),responses,completed:d.cards.filter(c=>responses[c.id]==='yes').map(c=>c.id)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.name.replace(/[^a-z0-9_-]+/gi,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Pobrano kopię talii wraz z edycjami i odpowiedziami.')}
render();
</script>
<script>
// Folder import is available on desktop browsers that support directory selection.
const folderButton=document.createElement('button');folderButton.className='btn secondary';folderButton.textContent='Wczytaj folder fiszki z komputera';const folderPicker=document.createElement('input');folderPicker.type='file';folderPicker.setAttribute('webkitdirectory','');folderPicker.setAttribute('directory','');folderPicker.multiple=true;folderPicker.style.display='none';el('dlg').insertBefore(folderButton,el('fileInput'));el('dlg').insertBefore(folderPicker,el('fileInput'));folderButton.onclick=()=>folderPicker.click();
folderPicker.onchange=async()=>{let added=0;for(const f of Array.from(folderPicker.files||[])){const name=f.name||'';if(!/\.(apkg|csv|tsv|txt|json)$/i.test(name)||name==='decks.json')continue;try{let imported,responses={},completed=[];if(/\.apkg$/i.test(name))imported=await apkg(f);else if(/\.json$/i.test(name)){const p=JSON.parse(await f.text());if(p.format!=='anki-mobile-deck-v1'||!Array.isArray(p.cards))continue;imported=p.cards;responses=p.responses||{};completed=p.completed||[]}else imported=await textfile(f);if(!imported.length)continue;const d={id:crypto.randomUUID(),name:name.replace(/\.[^.]+$/,''),cards:imported.map(c=>({id:c.id||crypto.randomUUID(),front:c.front,back:c.back})),source:'folder z komputera'};dbdata.decks.push(d);for(const c of d.cards){const answer=responses[c.id]||(completed.includes(c.id)?'yes':null);if(answer)dbdata.reviews[d.id+'-'+c.id]={answer}}added++}catch(e){console.warn('Nie udało się wczytać pliku '+name,e)}}el('dlg').close();folderPicker.value='';save();render();msg(added?'Wczytano '+added+' talii z folderu.':'Nie znaleziono obsługiwanych plików z fiszkami w wybranym folderze.')};
function deleteDeck(deckId){const d=dbdata.decks.find(x=>x.id===deckId);if(!d||!confirm('Usunąć całą talię „'+d.name+'” wraz ze wszystkimi fiszkami?'))return;for(const c of d.cards)delete dbdata.reviews[d.id+'-'+c.id];dbdata.decks=dbdata.decks.filter(x=>x.id!==deckId);pendingOrder=pendingOrder.filter(id=>!d.cards.some(c=>id===d.id+'-'+c.id));dbdata.pendingOrder=pendingOrder;inspectDeck=null;pos=0;shown=false;save();render();msg('Usunięto talię.')}
const previousList=list;list=function(){previousList();if(!inspectDeck)return;const toolsRow=el('decks').querySelector('.toolrow');if(!toolsRow)return;const b=document.createElement('button');b.className='btn danger';b.textContent='Usuń całą talię';b.onclick=()=>deleteDeck(inspectDeck);toolsRow.appendChild(b)};
if(location.protocol==='file:'){msg('Wybierz „Wczytaj folder fiszki z komputera”, aby załadować pliki TXT z folderu projektu.')}
</script>
<script>
// Public GitHub Pages projects can list the fiszki directory through GitHub's contents API.
async function scanGitHubTxtFolder(){if(location.protocol==='file:')return;const host=location.hostname,parts=decodeURIComponent(location.pathname).split('/').filter(Boolean);if(!host.endsWith('.github.io'))return;const owner=host.slice(0,-'.github.io'.length),repo=parts[0]||owner+'.github.io';try{const api='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/fiszki';const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!response.ok){console.warn('GitHub API nie udostępnił folderu fiszki',response.status);return}const entries=await response.json();if(!Array.isArray(entries))return;let count=0;for(const file of entries){if(file.type!=='file'||!file.name.toLowerCase().endsWith('.txt'))continue;const repoFile='fiszki/'+file.name;if(dbdata.decks.some(d=>d.repoFile===repoFile)||window.loadingRepoFiles?.has(repoFile))continue;if(!window.loadingRepoFiles)window.loadingRepoFiles=new Set();window.loadingRepoFiles.add(repoFile);try{let raw;if(file.download_url){const r=await fetch(file.download_url,{cache:'no-store'});if(!r.ok)continue;raw=await r.text()}else if(file.content)raw=decodeURIComponent(escape(atob(file.content.replace(/\s/g,''))));else continue;const imported=await textfile({name:file.name,text:async()=>raw});if(!imported.length)continue;const d={id:crypto.randomUUID(),name:file.name.replace(/\.txt$/i,''),cards:imported.map(c=>({id:crypto.randomUUID(),front:c.front,back:c.back})),source:'folder GitHub',repoFile};dbdata.decks.push(d);count++}catch(e){console.warn('Nie udało się wczytać '+file.name,e)}finally{window.loadingRepoFiles.delete(repoFile)}}if(count){save();render();msg('Automatycznie wczytano '+count+' plików TXT z folderu fiszki.')}}catch(e){console.warn('Nie udało się znaleźć plików TXT na GitHubie',e)}}scanGitHubTxtFolder();
</script>
<script>
let activeStudyDeck=dbdata.activeStudyDeck||'all';
due=function(){const remaining=cards().filter(c=>dbdata.reviews[c._id]?.answer!=='yes'),byId=new Map(remaining.map(c=>[c._id,c])),valid=new Set(byId.keys());pendingOrder=pendingOrder.filter(id=>valid.has(id));for(const c of remaining)if(!pendingOrder.includes(c._id))pendingOrder.push(c._id);dbdata.pendingOrder=pendingOrder;return pendingOrder.map(id=>byId.get(id)).filter(c=>c&&(activeStudyDeck==='all'||c.deckId===activeStudyDeck))};
function selectStudyDeck(id){activeStudyDeck=id;dbdata.activeStudyDeck=id;pos=0;shown=false;save();render()}
study=function(){const root=el('study'),all=cards();if(!dbdata.decks.some(d=>d.id===activeStudyDeck))activeStudyDeck='all';const options='<option value="all" '+(activeStudyDeck==='all'?'selected':'')+'>Wszystkie talie</option>'+dbdata.decks.map(d=>'<option value="'+esc(d.id)+'" '+(activeStudyDeck===d.id?'selected':'')+'>'+esc(d.name)+'</option>').join('');const selector=dbdata.decks.length?'<label class="study-picker-label" for="studyDeckSelect">Ucz się z talii</label><select id="studyDeckSelect" onchange="selectStudyDeck(this.value)">'+options+'</select>':'';if(!dbdata.decks.length){root.innerHTML='<div class="panel empty"><h2>Dodaj swoje fiszki</h2><p>Zaimportuj talię albo utwórz własną.</p><button class="btn primary" onclick="openDlg()">＋ Importuj talię</button></div>';return}const a=due();if(!a.length){root.innerHTML=selector+'<div class="panel empty"><div style="font-size:38px">✓</div><h2>To wszystkie fiszki</h2><p>'+(activeStudyDeck==='all'?'Nie ma już fiszek do przejścia.':'W tej talii nie ma już fiszek do przejścia.')+'</p><button class="btn secondary" onclick="setView(\'decks\')">Moje talie</button></div>';return}if(pos>=a.length)pos=0;const c=a[pos];root.innerHTML=selector+'<div class="panel"><div class="row"><span>'+esc(c.deck)+'</span><span>'+(pos+1)+' / '+a.length+'</span></div><div class="progress"><i style="width:'+(100*pos/a.length)+'%"></i></div><div class="flash" onclick="flip()"><div class="label">'+(shown?'Odpowiedź':'Pytanie')+'</div><div class="front">'+esc(c.front)+'</div>'+(shown?'<div class="back">'+esc(c.back)+'</div>':'<div class="hint">Dotknij fiszki, aby ją odwrócić</div>')+'</div><div class="actions">'+(shown?'<button class="rate answer-no" onclick="rate(\'no\')">NIE</button><button class="rate answer-yes" onclick="rate(\'yes\')">TAK</button>':'<button class="btn primary" style="width:100%" onclick="flip()">Odwróć fiszkę</button>')+'</div></div>'};
const renderBeforeDeckPicker=render;render=function(){renderBeforeDeckPicker();const chosen=cards().filter(c=>activeStudyDeck==='all'||c.deckId===activeStudyDeck);el('totalN').textContent=chosen.length;el('dueN').textContent=due().length;el('deckCount').textContent=dbdata.decks.length+' talii'};
const pickerStyle=document.createElement('style');pickerStyle.textContent='.study-picker-label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}.study-picker-label+select{width:100%;min-height:48px;padding:10px 40px 10px 13px;margin:0 0 12px;border:1px solid var(--line);border-radius:13px;background:#14161b;color:var(--ink);font:inherit}';document.head.appendChild(pickerStyle);
</script>
<script>
function resetAllDecks(){if(!confirm('Zresetować wszystkie talie? Odpowiedzi TAK/NIE zostaną wyczyszczone.'))return;dbdata.reviews={};pendingOrder=cards().map(c=>c._id);dbdata.pendingOrder=pendingOrder;pos=0;shown=false;done=0;save();render();msg('Wszystkie talie zresetowane.')}
